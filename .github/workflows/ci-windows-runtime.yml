name: CI - Windows bundled runtime

on:
  pull_request:
    paths:
      - "services/local-runtime/**"
      - "apps/windows/**"
      - "apps/dashboard/**"
      - "scripts/**"
      - ".github/workflows/ci-windows-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundled-runtime-and-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/local-runtime/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked desktop package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
      - name: Install runtime build dependencies
        run: python -m pip install -r services/local-runtime/requirements.txt "apscheduler<4" "pyinstaller>=6.11,<7" pillow
      - name: Build standalone runtime and verify bundled imports
        run: python scripts/build-desktop-runtime.py
      - name: Verify Windows user-protected provider and social credential persistence
        env:
          PYTHONPATH: services/local-runtime
        run: python -m pytest tests/unit/test_provider_store.py tests/unit/test_account_credentials.py -q
      - name: Install dashboard dependencies and build
        working-directory: apps/dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Install desktop dependencies and verify lifecycle contracts
        working-directory: apps/windows
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm test
      - name: Install browser test driver
        shell: pwsh
        run: |
          $driverDir = Join-Path $env:RUNNER_TEMP "javo-test-driver"
          npm install --prefix $driverDir playwright-core --ignore-scripts --no-audit --no-fund
          "JAVO_PLAYWRIGHT_MODULE=$driverDir/node_modules/playwright-core" >> $env:GITHUB_ENV
      - name: Verify content browser flow against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py
      - name: Verify saved goals against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario goals
      - name: Verify saved AI usage against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario usage
      - name: Verify durable specialist execution against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario agents
      - name: Verify saved account records against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario accounts
      - name: Verify measured setup and saved model checks against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario setup
      - name: Verify saved graphs and manual local runs against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario workflows
      - name: Verify voice controls and reviewed integrations against the frozen backend
        shell: pwsh
        run: |
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-dashboard.py --scenario creator
      - name: Verify real packaged neural speech with optional external models
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP "javo-speech-models"
          python scripts/install-speech-models.py --model-root $modelRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:JAVO_RUNTIME_EXE = (Resolve-Path "apps/windows/build/runtime/javo-runtime/javo-runtime.exe").Path
          python scripts/verify-local-speech.py --model-root $modelRoot --output-dir (Join-Path $env:RUNNER_TEMP "speech-evidence")
      - name: Download Electron and package unsigned development directory
        working-directory: apps/windows
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD
          python ../../packages/brand-assets/icons/generate_icons.py
          node node_modules/electron/install.js
          npm run verify:package
          npx electron-builder --win --dir --publish never --config electron-builder.yml
      - name: Verify packaged startup, controls, restart and quit
        run: node scripts/verify-packaged-desktop.cjs
      - name: Build unsigned NSIS and portable development packages
        working-directory: apps/windows
        run: npm run dist:win
      - name: Verify NSIS installation, uninstall and reinstallation
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath "apps/windows/release" -File -Filter "JavoAgents-*-x64.exe" | Where-Object Name -NotLike "*Portable*")
          if ($setups.Count -ne 1) { throw "Expected exactly one NSIS setup package." }
          ./scripts/verify-windows-installer.ps1 -Installer $setups[0].FullName
      - name: Report development package hashes
        shell: pwsh
        run: Get-ChildItem -LiteralPath "apps/windows/release" -File -Filter "*.exe" | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
