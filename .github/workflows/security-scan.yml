name: Security Scan

on:
  push:
    branches: [main, develop, "fix/**"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Repository Secret & Hygiene Scan
        run: python scripts/security_scan.py

  skill-ast-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Skill Sandbox & AST security tests
        run: python -m unittest skills/tests/test_sandbox.py -v
