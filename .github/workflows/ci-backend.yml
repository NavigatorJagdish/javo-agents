name: CI — Backend & Skill Sandbox

on:
  push:
    branches: [main, develop]
    paths:
      - "services/local-runtime/**"
      - "skills/**"
      - "tests/**"
      - "ruff.toml"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "services/local-runtime/**"
      - "skills/**"
      - "tests/**"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg for media worker tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/local-runtime/requirements.txt
          pip install pytest pytest-asyncio ruff bandit

      - name: Lint with Ruff
        run: ruff check --config ruff.toml services/local-runtime/app skills tests

      - name: Static security scan with Bandit
        run: bandit -r services/local-runtime/app skills -ll -q

      - name: Run Skill Sandbox & Core Skill tests
        run: python -m unittest skills/tests/test_sandbox.py skills/core/social-caption-optimizer/test_skill.py skills/core/hindi-hinglish-hook-writer/test_skill.py -v

      - name: Run Backend unit & integration tests
        env:
          PYTHONPATH: services/local-runtime
        run: python -m pytest tests -v
