name: CI — Android Companion

on:
  push:
    branches: [main, develop, "fix/**"]
    paths:
      - "apps/android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/ci-android.yml"

jobs:
  android-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK & AAB (Unsigned Verification)
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace
