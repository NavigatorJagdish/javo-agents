[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "javo-local-runtime"
version = "0.1.0"
description = "Javo Agents Local Runtime FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.2",
    "cryptography>=43.0.0",
    "psutil>=6.1.0",
    "watchdog>=5.0.3",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "services/local-runtime"]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
