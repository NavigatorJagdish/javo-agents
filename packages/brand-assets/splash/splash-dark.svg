<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Javo Agents Dark Splash Screen">
  <defs>
    <radialGradient id="splash-dark-glow" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#1E295E" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#0E1533" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1026" />
    </radialGradient>
    <linearGradient id="splash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="splash-bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="splash-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#splash-dark-glow)" />

  <!-- Subtle Grid Backdrop -->
  <g stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="540" x2="1280" y2="540" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
  </g>

  <!-- Central Shield Emblem -->
  <g transform="translate(640, 290)">
    <ellipse cx="0" cy="0" rx="132" ry="52" transform="rotate(-22)" fill="none" stroke="url(#splash-grad)" stroke-width="3" stroke-opacity="0.85" filter="url(#splash-blur)" />
    <circle cx="114" cy="-48" r="6" fill="#00E5FF" filter="url(#splash-blur)" />

    <polygon
      points="0,-106 92,-53 92,42 0,106 -92,42 -92,-53"
      fill="#0B1026"
      fill-opacity="0.92"
      stroke="url(#splash-grad)"
      stroke-width="6"
      stroke-linejoin="round"
      filter="url(#splash-blur)"
    />

    <g stroke="url(#splash-grad)" stroke-width="3" stroke-opacity="0.85">
      <line x1="0" y1="-64" x2="0" y2="-28" />
      <line x1="-50" y1="38" x2="-20" y2="14" />
      <line x1="50" y1="38" x2="20" y2="14" />
    </g>

    <circle cx="0" cy="-64" r="8" fill="#00E5FF" filter="url(#splash-blur)" />
    <circle cx="-50" cy="38" r="8" fill="#38BDF8" filter="url(#splash-blur)" />
    <circle cx="50" cy="38" r="8" fill="#8B5CF6" filter="url(#splash-blur)" />

    <g fill="url(#splash-bars)" filter="url(#splash-blur)">
      <rect x="-30" y="-14" width="8" height="28" rx="4" />
      <rect x="-15" y="-28" width="8" height="56" rx="4" />
      <rect x="-4" y="-38" width="8" height="76" rx="4" />
      <rect x="7" y="-28" width="8" height="56" rx="4" />
      <rect x="22" y="-14" width="8" height="28" rx="4" />
    </g>
  </g>

  <!-- Title & Tagline -->
  <text x="640" y="465" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#FFFFFF">JAVO AGENTS</text>
  <text x="640" y="505" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="4" fill="#E2E6F0" opacity="0.8">PRIVATE · LOCAL-FIRST · SUPERVISED AUTOPILOT</text>

  <!-- Loading Bar Placeholder -->
  <rect x="490" y="555" width="300" height="6" rx="3" fill="#1E293B" />
  <rect x="490" y="555" width="140" height="6" rx="3" fill="url(#splash-grad)" />
</svg>
