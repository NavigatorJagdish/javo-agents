  <text x="640" y="465" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#0B1026">JAVO AGENTS</text>
  <text x="640" y="505" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="4" fill="#475569">PRIVATE · LOCAL-FIRST · SUPERVISED AUTOPILOT</text>

  <rect x="490" y="555" width="300" height="6" rx="3" fill="#CBD5E1" />
  <rect x="490" y="555" width="140" height="6" rx="3" fill="url(#splash-light-grad)" />
</svg>
